# Test and build on every push and pull request; publish the playable game from main to https://ebbfall.com/, a
# Cloudflare Worker (site/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      # Installs the toolchain, clippy, rustfmt and the wasm32 target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --skip random_play
      - name: Gameplay tests including randomized play (release mode, more seeds)
        run: cargo test --release --locked --test gameplay
      - run: npm ci
      - run: npm run build:wasm
      - run: npm test
        env:
          ENDFALL_REQUIRE_WASM: '1'
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }} # (the relay's wss:// address once it is deployed; unset: no PLAY A FRIEND)
      - name: Gameplay tests in a real browser (Chromium; WebKit and Firefox in the engines job)
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The browser tests' cross-engine subset (the scenarios marked `engines: true`: the menu, sound and full screen, a short
  # game through the UI, taps on a phone, joining a room through a local relay, offline, the golden games) in WebKit
  # (Safari's engine) and Firefox, beside the build job. Firefox has WebGL only with a display: a virtual one (xvfb).
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache/restore@v6 # (the build job's cache, read only)
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: rustup toolchain install
      - run: npm ci
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - name: The cross-engine subset in ${{ matrix.engine }}
        run: |
          if [ "$ENDFALL_ENGINE" = firefox ]; then xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e; else npm run test:e2e; fi
        env:
          ENDFALL_ENGINE: ${{ matrix.engine }}

  # Determinism on another CPU: the golden games natively, in WASM in Node's V8, and in WebKit (JavaScriptCore on
  # arm64, as on an iPhone) on an ARM Mac.
  arm:
    runs-on: macos-15 # (Playwright's WebKit for macOS 14 is frozen)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - run: rustup toolchain install
      - run: cargo test --release --locked --test golden
      - run: npm ci
      - run: npm run build
      - run: node --test test/engine.test.js
        env:
          ENDFALL_REQUIRE_WASM: '1'
      - name: The device check in WebKit
        timeout-minutes: 10
        run: |
          npx playwright-core install webkit
          node --test test/e2e/selftest.e2e.mjs
        env:
          ENDFALL_ENGINE: webkit

  # The multiplayer relay (relay/worker.js) to Cloudflare, once the owner has added the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets (until then this job does nothing). Only when relay/ changed, or on a run started by
  # hand: a deploy restarts every room and ends the games in progress.
  relay:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The relay and the site go out together: the relay waits for every check the site waits for, and the site for the
    # relay, so a failing check never leaves a new relay talking to the old site (a new protocol would tell every player
    # to UPDATE to a version that is not there yet).
    needs: [build, engines, arm]
    runs-on: ubuntu-latest
    concurrency:
      group: relay
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          fetch-depth: 2
      - id: changed
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: git diff --quiet HEAD~1 HEAD -- relay/ src/client/maps.js src/engine/util.js || echo "relay=1" >> "$GITHUB_OUTPUT" # (the relay bundles the maps and their helper too)
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.relay == '1' || (env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'workflow_dispatch')
        with:
          node-version-file: .nvmrc
      - name: Deploy the relay
        if: steps.changed.outputs.relay == '1' || (env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'workflow_dispatch')
        working-directory: relay
        run: npx --yes wrangler@4 deploy

  # The site: https://ebbfall.com/ (and www) as a Cloudflare Worker with static assets (site/: worker.js, wrangler.toml;
  # docs/MULTIPLAYER.md, Hosting), off GitHub Pages since 2026-10-30. The files are the build job's (its Pages artifact,
  # tested there). Before the deploy, site/dns.mjs deletes GitHub Pages' old DNS records for the two hostnames, which a
  # custom domain cannot share (on later runs there are none left: it deletes nothing); what it deletes is in the job
  # summary, for a rollback, and is put back at once if the deploy then fails. Needs the CLOUDFLARE_API_TOKEN (Workers
  # Scripts and Routes edit, DNS edit) and CLOUDFLARE_ACCOUNT_ID secrets; without them it does nothing.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, engines, arm, relay] # (a determinism break in another engine or on another CPU blocks publishing; the relay first)
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://ebbfall.com/
    concurrency:
      group: site
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: No Cloudflare secrets, no deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret, so the site is not deployed"
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/download-artifact@v8
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Unpack the build
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: mkdir dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist && test -f dist/index.html && test -f dist/sw.js
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version-file: .nvmrc
      - name: Clear GitHub Pages' DNS records for ebbfall.com and www
        id: dns
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node site/dns.mjs remove-pages "$RUNNER_TEMP/pages-dns.json"
      - name: Deploy the site's Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site
        env:
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }} # (unset: no beacon from the Worker; worker.js `page`)
        run: npx --yes wrangler@4 deploy ${CF_ANALYTICS_TOKEN:+--var "CF_ANALYTICS_TOKEN:$CF_ANALYTICS_TOKEN"} # (its [build] step writes dist/_headers first)
      - name: The deploy failed, so GitHub Pages' DNS records go back
        if: failure() && (steps.dns.outcome == 'success' || steps.dns.outcome == 'failure')
        run: if [ -f "$RUNNER_TEMP/pages-dns.json" ]; then node site/dns.mjs restore "$RUNNER_TEMP/pages-dns.json"; fi
