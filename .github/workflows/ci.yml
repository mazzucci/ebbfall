# Test and build on every push and pull request; publish the playable game from main to GitHub Pages
# (https://ebbfall.com/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      # Installs the toolchain, clippy, rustfmt and the wasm32 target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --skip random_play
      - name: Gameplay tests including randomized play (release mode, more seeds)
        run: cargo test --release --locked --test gameplay
      - run: npm ci
      - run: npm run build:wasm
      - run: npm test
        env:
          ENDFALL_REQUIRE_WASM: '1'
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }} # (the relay's wss:// address once it is deployed; unset: no PLAY A FRIEND)
      - name: Gameplay tests in a real browser
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The multiplayer relay (relay/worker.js) to Cloudflare, once the owner has added the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets (until then this job does nothing). Only when relay/ changed, or on a run started by
  # hand: a deploy restarts every room and ends the games in progress.
  relay:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: relay
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          fetch-depth: 2
      - id: changed
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: git diff --quiet HEAD~1 HEAD -- relay/ || echo "relay=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.relay == '1' || (env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'workflow_dispatch')
        with:
          node-version-file: .nvmrc
      - name: Deploy the relay
        if: steps.changed.outputs.relay == '1' || (env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'workflow_dispatch')
        working-directory: relay
        run: npx --yes wrangler@4 deploy

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

