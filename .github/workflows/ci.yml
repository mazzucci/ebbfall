# Test and build on every push and pull request; publish the playable game from main to GitHub Pages
# (https://mazzucci.github.io/endfall/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      # Installs the toolchain, clippy, rustfmt and the wasm32 target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Randomized gameplay invariants (more seeds in release mode)
        run: cargo test --release --locked --test gameplay
      - run: npm ci
      - run: npm run build:wasm
      - run: npm test
        env:
          ENDFALL_REQUIRE_WASM: '1'
      - name: JS and Rust sims agree tick for tick
        run: node scripts/parity.mjs 9000 1,2,3
      - run: npm run build
      - name: Gameplay tests in a real browser
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

