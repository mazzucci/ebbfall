# Test and build on every push and pull request; publish the playable game from main to https://ebbfall.com/, a
# Cloudflare Worker (site/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      # Installs the toolchain, clippy, rustfmt and the wasm32 target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --skip random_play
      - name: Gameplay tests including randomized play (release mode, more seeds)
        run: cargo test --release --locked --test gameplay
      - run: npm ci
      - run: npm run build:wasm
      - run: npm test
        env:
          ENDFALL_REQUIRE_WASM: '1'
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }} # (the relay's wss:// address once it is deployed; unset: no PLAY A FRIEND)
      - name: Gameplay tests in a real browser (Chromium; WebKit and Firefox in the engines job)
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The browser tests' cross-engine subset (the scenarios marked `engines: true`: the menu, sound and full screen, a short
  # game through the UI, taps on a phone, joining a room through a local relay, offline, the golden games) in WebKit
  # (Safari's engine) and Firefox, beside the build job. Firefox has WebGL only with a display: a virtual one (xvfb).
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache/restore@v6 # (the build job's cache, read only)
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: rustup toolchain install
      - run: npm ci
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - name: The cross-engine subset in ${{ matrix.engine }}
        run: |
          if [ "$ENDFALL_ENGINE" = firefox ]; then xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e; else npm run test:e2e; fi
        env:
          ENDFALL_ENGINE: ${{ matrix.engine }}

  # Determinism on another CPU: the golden games natively, in WASM in Node's V8, and in WebKit (JavaScriptCore on
  # arm64, as on an iPhone) on an ARM Mac.
  arm:
    runs-on: macos-15 # (Playwright's WebKit for macOS 14 is frozen)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
            .tools
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - run: rustup toolchain install
      - run: cargo test --release --locked --test golden
      - run: npm ci
      - run: npm run build
      - run: node --test test/engine.test.js
        env:
          ENDFALL_REQUIRE_WASM: '1'
      - name: The device check in WebKit
        timeout-minutes: 10
        run: |
          npx playwright-core install webkit
          node --test test/e2e/selftest.e2e.mjs
        env:
          ENDFALL_ENGINE: webkit

  # The multiplayer relay (relay/worker.js) to Cloudflare, once the owner has added the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets (until then this job does nothing). Deployed when the live relay is not this commit's:
  # its build (a hash of the bundle wrangler would upload, and of wrangler.toml) is passed at deploy as the RELAY_BUILD
  # var and served at GET /version (relay/version.js); a relay whose /version says another build, or none (deployed by
  # hand, or before /version), is deployed, as on a run started by hand. Not on every push: a deploy restarts every room
  # and ends the games in progress. (Not "did this push change relay/": a run that was cancelled or failed would leave
  # the change undeployed for good.) Wrangler is pinned: its bundle is the build, and a new wrangler may bundle the same
  # code differently (a bump redeploys once).
  relay:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The relay and the site go out together: the relay waits for every check the site waits for, and the site for the
    # relay, so a failing check never leaves a new relay talking to the old site (a new protocol would tell every player
    # to UPDATE to a version that is not there yet).
    needs: [build, engines, arm]
    runs-on: ubuntu-latest
    concurrency:
      group: relay
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_URL: ${{ vars.RELAY_URL || 'wss://relay.ebbfall.com/' }} # (relay/wrangler.toml's custom domain)
      WRANGLER: wrangler@4.156.0
    steps:
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
      - name: This commit's relay build (a hash of the bundle and its config)
        id: build
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: relay
        run: |
          out="$RUNNER_TEMP/relay-bundle"
          npx --yes "$WRANGLER" deploy --dry-run --outdir "$out" > /dev/null
          build=$(cd "$out" && find . -name '*.js' | LC_ALL=C sort | xargs cat | cat - "$GITHUB_WORKSPACE/relay/wrangler.toml" | sha256sum | cut -c1-16)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "This commit's relay build: $build"
      - name: The live relay's build (GET /version)
        id: live
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          base="${RELAY_URL/#ws/http}"; base="${base%/}"
          live=$(curl -fsS --max-time 15 --retry 3 "$base/version" | jq -r '.build // empty' 2> /dev/null || true)
          echo "The live relay's build: ${live:-none (no /version, or no answer)}"
          if [ "$live" = "$BUILD" ]; then echo "The relay is up to date: not deployed"; else echo "deploy=1" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy the relay
        if: steps.live.outputs.deploy == '1' || (env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'workflow_dispatch')
        working-directory: relay
        run: npx --yes "$WRANGLER" deploy --var "RELAY_BUILD:${{ steps.build.outputs.build }}"
      - name: The live relay is the new build
        if: steps.live.outputs.deploy == '1' || (env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'workflow_dispatch')
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          base="${RELAY_URL/#ws/http}"; base="${base%/}"
          for i in $(seq 24); do
            live=$(curl -fsS --max-time 10 "$base/version" | jq -r '.build // empty' 2> /dev/null || true)
            if [ "$live" = "$BUILD" ]; then echo "The relay serves build $BUILD"; exit 0; fi
            sleep 5
          done
          echo "::error::$base/version still says build '${live:-none}' two minutes after deploying $BUILD"
          exit 1

  # The site: https://ebbfall.com/ (and www) as a Cloudflare Worker with static assets (site/: worker.js, wrangler.toml;
  # docs/MULTIPLAYER.md, Hosting), off GitHub Pages since 2026-10-30. The files are the build job's (its Pages artifact,
  # tested there). First the relay check: the site never outruns the relay. The Worker answers through zone routes,
  # which see proxied traffic only: the deploy attaches them first (nothing changes yet), then site/dns.mjs proxy turns
  # the proxy on for GitHub Pages' own DNS records, an edit in place (the hostnames resolve throughout: to GitHub until
  # then, to the Worker after); a failed deploy proxies nothing. The records are logged into the job summary first, for
  # a rollback (`dns.mjs unproxy`). Needs the CLOUDFLARE_API_TOKEN (Workers Scripts edit, Workers Routes edit and DNS
  # edit on the zone) and CLOUDFLARE_ACCOUNT_ID secrets; without them it deploys nothing.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, engines, arm, relay] # (a determinism break in another engine or on another CPU blocks publishing; the relay first)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare
      url: https://ebbfall.com/
    concurrency:
      group: site
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_URL: ${{ vars.RELAY_URL }} # (the relay the build baked in; unset: no multiplayer, nothing to check)
      WRANGLER: wrangler@4.156.0 # (the relay job's)
    steps:
      - uses: actions/checkout@v7
      # The site never outruns the relay: a client of another protocol than the live relay's could open no room ("Ebbfall
      # has an update"). The relay job deployed it if it was not this commit's; this checks that it took. It fails the
      # job before anything below touches DNS or the site.
      - name: The live relay speaks this site's protocol
        if: env.RELAY_URL != ''
        run: |
          want=$(sed -n 's/^export const PROTO = \([0-9][0-9]*\);.*/\1/p' relay/room.js) # (src/net/net.js's too: test/relay-worker.test.js)
          [ -n "$want" ] || { echo "::error::No PROTO found in relay/room.js"; exit 1; }
          base="${RELAY_URL/#ws/http}"; base="${base%/}"
          for i in $(seq 12); do
            live=$(curl -fsS --max-time 10 "$base/version" | jq -r '.proto // empty' 2> /dev/null || true)
            if [ "$live" = "$want" ]; then echo "The relay at $base speaks PROTO $want"; exit 0; fi
            sleep 5
          done
          echo "::error::The relay at $base speaks PROTO ${live:-unknown (no /version)}, this site's client PROTO $want: not publishing a site that could not open a room. Deploy the relay (Actions, CI, Run workflow), then run this again."
          exit 1
      - name: No Cloudflare secrets, no deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret, so the site is not deployed"
      - uses: actions/download-artifact@v8
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Unpack the build
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: mkdir dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist && test -f dist/index.html && test -f dist/sw.js
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version-file: .nvmrc
      - name: The DNS records before this deploy, for a rollback (job summary)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node site/dns.mjs log "$RUNNER_TEMP/pages-dns.json"
      - name: No custom domain left of ebbfall-site on the two hostnames (#174's first attempt)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node site/dns.mjs drop-domains
      - name: Install wrangler and check the Worker's config (nothing published)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site
        run: npx --yes "$WRANGLER" deploy --dry-run
      - name: Deploy the site's Worker and its routes
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site
        env:
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }} # (unset: no beacon from the Worker; worker.js `page`)
        run: npx --yes "$WRANGLER" deploy ${CF_ANALYTICS_TOKEN:+--var "CF_ANALYTICS_TOKEN:$CF_ANALYTICS_TOKEN"} # (its [build] step writes dist/_headers first)
      - name: The hostnames through Cloudflare, so to the Worker (GitHub Pages' records proxied; once)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node site/dns.mjs proxy
