<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ebbfall: a castle tower whose middle merlon is a radio mast. The Kingdom's tower in its royal blue, the Expedition's
       mast in white with the signal it sends, and the gold they fight over as the mast's lamp. On a dark plate (a circle
       of the UI's navy); everything drawn keeps inside it, tools/icons.mjs fits it to the maskable safe zone. The
       favicon inline in index.html is this mark redrawn on a 16-pixel grid: change both together. -->
  <rect width="64" height="64" rx="32" fill="#0f1626"/>
  <!-- the tower: body, two outer merlons, a gate -->
  <path d="M15 27h8v7h18v-7h8v29H15zM27 56v-7a5 5 0 0 1 10 0v7z" fill="#2f63d6" fill-rule="evenodd"/>
  <!-- the mast, with its lamp and signal -->
  <rect x="29" y="17" width="6" height="19" fill="#eef3f8"/>
  <path d="M23.2 5.6a11.5 11.5 0 0 0 0 14.8M40.8 5.6a11.5 11.5 0 0 1 0 14.8" fill="none" stroke="#eef3f8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="13" r="4.8" fill="#f5a524"/>
</svg>
