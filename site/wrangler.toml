# The site on Cloudflare (site/worker.js): the built game (dist/, `npm run build` at the repo root) as a Worker's static
# assets, at https://ebbfall.com/ (Notion: Multiplayer design, Hosting). CI deploys it from main (the `deploy` job); by hand,
# from site/ with `npx wrangler deploy` (CLOUDFLARE_API_TOKEN in the environment: Workers Scripts edit, and Workers
# Routes edit on the zone).
name = "ebbfall-site"
main = "worker.js"
compatibility_date = "2026-10-01"
# Zone routes, not custom domains: the hostnames keep their own DNS records (GitHub Pages', which a custom domain would
# need deleted first: a gap), and a route sees what Cloudflare proxies, so the switch is turning the proxy on for those
# records (site/dns.mjs proxy, after this deploy), and the rollback turning it off. www answers too: its files served as
# on ebbfall.com, the game's page sending itself on to https://ebbfall.com/ (index.html's first script), anything else
# by the Worker (worker.js CANONICAL). (A zone Redirect Rule, www to the apex, would send every www address on without a
# Worker: a dashboard setting, not this file's.)
routes = [
  { pattern = "ebbfall.com/*", zone_name = "ebbfall.com" },
  { pattern = "www.ebbfall.com/*", zone_name = "ebbfall.com" },
]
workers_dev = false # (one address: the game's storage and service worker belong to its origin)
preview_urls = false

[assets]
directory = "../dist"
binding = "ASSETS"
# Every file is served by Cloudflare directly, with dist/_headers (cache and security headers, build.mjs), and costs no
# Worker request: the game's page, the docs, single player. So a tripped Workers spending limit (error 1103 for every
# Worker request) leaves them up; it takes only what the Worker answers (worker.js: a room's card address /r/CODE, a
# challenge's /vs/CODE, the feedback form's POST /api/feedback, the CSP's reports, www and http sent on, not found) and
# the relay (online play).
# Pages at their canonical addresses: / is index.html, /docs/kingdom/ that folder's index.html (/docs/kingdom is sent
# to it), /selftest is selftest.html (/selftest.html and /index.html are sent on, 307, to /selftest and /). The
# service worker stores a page fetched through such a redirect as a response of its own, at both addresses
# (tools/offline/sw.js), as a redirected response could not answer a page load.
html_handling = "auto-trailing-slash"
# What is not a file goes to the Worker (no run_worker_first: it never runs before a file).
not_found_handling = "none"

[build]
command = "node build.mjs" # (writes dist/_headers from cache.js, and the analytics beacon into index.html with CF_ANALYTICS_TOKEN)

[dev]
upstream_protocol = "https" # (wrangler dev hands the Worker https://ebbfall.com/...: not sent on to https by worker.js)

# The docs' feedback form (POST /api/feedback: site/feedback.js), mailed through Cloudflare Email Sending (ebbfall.com is
# onboarded as a sending domain; the sender, feedback@ebbfall.com, is of it). The binding may mail one address only, ours:
# whatever the Worker is made to do, it can write to nobody else.
[[send_email]]
name = "FEEDBACK_EMAIL"
destination_address = "contact@ebbfall.com"

# Sends per address a minute (feedback.js PER_MINUTE), counted where the request lands, no storage, before the budget
# object is woken. Namespace ids are the account's: the relay's are 1001-1004.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1101"
simple = { limit = 2, period = 60 }

# What a minute's binding cannot count (Rate Limiting periods are 10 or 60 s): an address's hour (PER_HOUR) and everyone's
# UTC day (PER_DAY), one object, one record of counters (no message, no address but a short hash, nothing older than an
# hour per address). Woken only by a request that passed every other check.
[[durable_objects.bindings]]
name = "FEEDBACK_BUDGET"
class_name = "FeedbackBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackBudget"] # (SQLite-backed, as the relay's: the kind the free plan has too; one small record)
